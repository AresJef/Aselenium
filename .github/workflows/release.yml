name: Validate and publish Python release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/tests.yml
    with:
      reliability_duration: 600

  verify-release:
    name: Verify tagged release artifacts
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Match release tag to package version
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check_release.py
      - name: Download the native-tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist
      - name: Validate final distribution metadata
        run: |
          python -m pip install "twine>=6,<7" "readme-renderer[md]>=46,<47"
          python - <<'PY'
          from pathlib import Path
          from readme_renderer import markdown

          if markdown.render(Path("README.md").read_text()) is None:
              raise SystemExit("README.md cannot be rendered for PyPI")
          PY
          python -m twine check --strict dist/*.whl dist/*.tar.gz

  pypi:
    name: Publish tested distributions to PyPI
    if: vars.ASELENIUM_PUBLISH_ENABLED == 'true'
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/aselenium/
    permissions:
      id-token: write
    steps:
      - name: Download the native-tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Publish GitHub Release
    needs: [verify-release, pypi]
    if: >-
      ${{ always()
          && needs.verify-release.result == 'success'
          && (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the native-tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-distributions
          path: dist
      - name: Create distribution checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
      - name: Publish the tested artifacts and release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          notes="docs/releases/${release_version}.md"
          test -f "$notes"
          gh release create "$RELEASE_TAG" \
            dist/*.whl dist/*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aselenium ${release_version}" \
            --notes-file "$notes" \
            --verify-tag
