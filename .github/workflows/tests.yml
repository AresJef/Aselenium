name: Package regression tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      reliability_duration:
        description: Chrome and Edge sustained-session duration in seconds
        required: false
        type: number
        default: 30
  workflow_call:
    inputs:
      reliability_duration:
        description: Chrome and Edge sustained-session duration in seconds
        required: false
        type: number
        default: 30
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

jobs:
  build-distributions:
    name: Build canonical distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Build wheel and source distribution once
        run: python -m build --no-isolation --outdir dist
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Upload canonical distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  package-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]
        dependencies: [current]
        include:
          - os: windows-latest
            python-version: "3.13"
            dependencies: current
          - os: macos-latest
            python-version: "3.13"
            dependencies: current
          - os: ubuntu-latest
            python-version: "3.11"
            dependencies: minimum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-minimum.txt
            pyproject.toml
      - name: Install package and test dependencies
        if: matrix.dependencies == 'current'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install exact minimum runtime dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -r requirements-dev.txt -c requirements-minimum.txt
      - name: Run package regression suite including isolated loopback transport
        run: python -m coverage run --branch --source=aselenium -m pytest --asyncio-debug
      - name: Report line and branch coverage
        run: python -m coverage report
      - name: Enforce canonical critical-component coverage floors
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && matrix.dependencies == 'current'
        run: |
          python -m coverage json -o coverage.json
          python scripts/check_coverage.py coverage.json
      - name: Verify dependency resolution
        run: python -m pip check
      - name: Audit resolved dependencies against published advisories
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -m pip_audit --skip-editable
      - name: Check Python correctness, formatting, documentation and typing
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python scripts/check_api_quality.py
          python scripts/check_example_contracts.py
          python -m mypy

  native-browsers:
    needs: [build-distributions, package-tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chrome
          - os: ubuntu-24.04
            browser: firefox
          - os: windows-2025
            browser: edge
          - os: macos-15
            browser: chrome
          - os: macos-15
            browser: firefox
          - os: macos-15
            browser: safari
    defaults:
      run:
        shell: bash
    env:
      RELIABILITY_DURATION: ${{ github.event_name == 'schedule' && 600 || inputs.reliability_duration || 30 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install acceptance tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Download the canonical distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-distributions
          path: dist
      - name: Install the canonical wheel into an isolated environment
        id: installed
        run: |
          python -m venv "$RUNNER_TEMP/aselenium-wheel-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            acceptance_python="$RUNNER_TEMP/aselenium-wheel-env/Scripts/python.exe"
          else
            acceptance_python="$RUNNER_TEMP/aselenium-wheel-env/bin/python"
          fi
          "$acceptance_python" -m pip install dist/*.whl
          "$acceptance_python" -m pip check
          echo "python=$acceptance_python" >> "$GITHUB_OUTPUT"
      - name: Check typed public consumers from the installed package
        run: python scripts/check_public_typing.py --python "${{ steps.installed.outputs.python }}"
      - name: Enable Safari only on the disposable hosted runner
        if: matrix.browser == 'safari'
        run: sudo /usr/bin/safaridriver --enable
      - name: Run all applicable installed-wheel browser stages
        run: >-
          python scripts/test_installed_browser.py
          --python "${{ steps.installed.outputs.python }}"
          --browser "${{ matrix.browser }}"
          --cache-dir "$RUNNER_TEMP/aselenium-native-cache"
          --output-dir .acceptance-results
          --allow-download
      - name: Verify owned-process recovery, proxies and sustained sessions
        if: matrix.browser == 'chrome' || matrix.browser == 'edge'
        run: >-
          python scripts/run_reliability.py
          --python "${{ steps.installed.outputs.python }}"
          --browser "${{ matrix.browser }}"
          --cache-dir "$RUNNER_TEMP/aselenium-native-cache"
          --output-dir .acceptance-results/reliability
          --duration "$RELIABILITY_DURATION"
      - name: Retain browser versions, stage results and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.browser }}
          path: .acceptance-results/
          if-no-files-found: warn
          retention-days: 14
