name: Promote an existing tested release to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag (for example v2.0.0)
        required: true
        type: string
      validation_run:
        description: Successful release.yml run ID for that exact tag
        required: true
        type: string

permissions:
  contents: read

# Share the tag workflow's lock so both paths cannot publish concurrently.
concurrency:
  group: release-refs/tags/${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-promotion:
    name: Verify existing release and successful tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify provenance and recover the exact published files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: python -m scripts.prepare_pypi_promotion
      - name: Check distribution metadata
        run: |
          python -m pip install "twine>=6,<7"
          python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Retain verified distributions for isolated publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  pypi:
    name: Publish verified existing distributions to PyPI
    needs: verify-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/aselenium/
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-pypi-distributions
          path: dist
      - name: Check publishing secret availability
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::Configure the PYPI_API_TOKEN repository or pypi environment secret."
            exit 1
          fi
      - name: Publish with the PyPI API token
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
